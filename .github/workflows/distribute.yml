name: Distribute to Firebase App Distribution

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribute-main
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  prepare:
    name: Prepare distribution source
    if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      has_project: ${{ steps.detect.outputs.has_project }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Check out source commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Record source commit
        id: meta
        shell: bash
        run: echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Detect Android project
        id: detect
        shell: bash
        run: |
          if [[ -f pgm/tinyworks/gradlew && -f pgm/tinyworks/settings.gradle.kts ]]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android project not yet created::Distribution will start after pgm/tinyworks is added."
          fi

  manual-validate:
    name: Validate manual distribution
    needs: prepare
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.prepare.outputs.has_project == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pgm/tinyworks
    steps:
      - name: Check out source commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK API 37
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.3

      - name: Run unit tests and lint
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug

  distribute:
    name: Build, sign, and distribute APK
    needs:
      - prepare
      - manual-validate
    if: >-
      always() &&
      needs.prepare.outputs.has_project == 'true' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          needs.manual-validate.result == 'success'
        )
      )
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pgm/tinyworks

    steps:
      - name: Check out source commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK API 37
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.3

      - name: Build distribution APK
        run: >-
          bash ./gradlew --no-daemon
          -PversionCode="$GITHUB_RUN_NUMBER"
          -PversionName="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          -PversionNameSuffix=""
          assembleDebug

      - name: Sign distribution APK with fixed keystore
        env:
          TINYWORKS_KEYSTORE_BASE64: ${{ secrets.TINYWORKS_KEYSTORE_BASE64 }}
          TINYWORKS_STORE_PASSWORD: ${{ secrets.TINYWORKS_STORE_PASSWORD }}
          TINYWORKS_KEY_ALIAS: ${{ secrets.TINYWORKS_KEY_ALIAS }}
          TINYWORKS_KEY_PASSWORD: ${{ secrets.TINYWORKS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          keystore_path="${RUNNER_TEMP}/tinyworks-distribution.keystore"
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          signed_apk_path="${RUNNER_TEMP}/tinyworks-distribution-signed.apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_SDK_ROOT/ANDROID_HOME is required}}"
          apksigner_path="${sdk_root}/build-tools/37.0.0/apksigner"

          test -n "$TINYWORKS_KEYSTORE_BASE64"
          test -n "$TINYWORKS_STORE_PASSWORD"
          test -n "$TINYWORKS_KEY_ALIAS"
          test -n "$TINYWORKS_KEY_PASSWORD"

          umask 077
          printf '%s' "$TINYWORKS_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          test -x "$apksigner_path"

          "$apksigner_path" sign \
            --ks "$keystore_path" \
            --ks-key-alias "$TINYWORKS_KEY_ALIAS" \
            --ks-pass env:TINYWORKS_STORE_PASSWORD \
            --key-pass env:TINYWORKS_KEY_PASSWORD \
            --out "$signed_apk_path" \
            "$apk_path"

          mv "$signed_apk_path" "$apk_path"
          "$apksigner_path" verify "$apk_path"

      - name: Upload APK to Firebase App Distribution
        env:
          TINYWORKS_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.TINYWORKS_FIREBASE_SERVICE_ACCOUNT_JSON }}
          TINYWORKS_FIREBASE_PROJECT_ID: ${{ secrets.TINYWORKS_FIREBASE_PROJECT_ID }}
          TINYWORKS_FIREBASE_APP_ID: ${{ secrets.TINYWORKS_FIREBASE_APP_ID }}
          TINYWORKS_FIREBASE_TESTER_EMAIL: ${{ secrets.TINYWORKS_FIREBASE_TESTER_EMAIL }}
          RELEASE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          credentials_path="${RUNNER_TEMP}/tinyworks-firebase-service-account.json"
          test -n "$TINYWORKS_FIREBASE_SERVICE_ACCOUNT_JSON"
          test -n "$TINYWORKS_FIREBASE_PROJECT_ID"
          test -n "$TINYWORKS_FIREBASE_APP_ID"
          test -n "$TINYWORKS_FIREBASE_TESTER_EMAIL"

          umask 077
          printf '%s' "$TINYWORKS_FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_path"
          test -s "$credentials_path"

          GOOGLE_APPLICATION_CREDENTIALS="$credentials_path" \
            npx --yes firebase-tools@15.30.0 appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --project "$TINYWORKS_FIREBASE_PROJECT_ID" \
            --app "$TINYWORKS_FIREBASE_APP_ID" \
            --testers "$TINYWORKS_FIREBASE_TESTER_EMAIL" \
            --release-notes "main / Actions run ${GITHUB_RUN_NUMBER} / ${RELEASE_SHA}"

      - name: Remove temporary credentials and signed APK
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f \
            "${RUNNER_TEMP}/tinyworks-distribution.keystore" \
            "${RUNNER_TEMP}/tinyworks-distribution-signed.apk" \
            "${RUNNER_TEMP}/tinyworks-firebase-service-account.json" \
            "app/build/outputs/apk/debug/app-debug.apk"
