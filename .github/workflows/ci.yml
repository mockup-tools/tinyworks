name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'pgm/tinyworks/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - '**'
    paths:
      - 'pgm/tinyworks/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-check:
    name: Check Android project
    runs-on: ubuntu-24.04
    outputs:
      has_project: ${{ steps.detect.outputs.has_project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Detect Android project
        id: detect
        shell: bash
        run: |
          if [[ -f pgm/tinyworks/gradlew && -f pgm/tinyworks/settings.gradle.kts ]]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
            echo "Android project found."
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android project not yet created::CI build will start after pgm/tinyworks is added."
          fi

  build:
    name: Test, lint, and build
    needs: project-check
    if: needs.project-check.outputs.has_project == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pgm/tinyworks

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK API 37
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.3

      - name: Run unit tests, lint, and debug build
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
